# One-click deploy config. In Render: New → Blueprint → pick this repo.
# It reads this file, then asks for the two secrets below.
services:
  - type: web
    name: squish
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      # Your Anthropic key. Typed into Render's dashboard, never into the repo.
      - key: ANTHROPIC_API_KEY
        sync: false
      # Anyone with the URL needs this to use the app — without it, strangers
      # spend your Anthropic credit.
      - key: SQUISH_PASSCODE
        sync: false
      # Turns on the device token, the diary backup and accounts. Filled in by
      # Render from the database below, so there is nothing to type.
      #
      # Remove this and the database, and Squish still works — the diary lives
      # in the browser and nothing is kept on the server. That is the mode it
      # was written in and it is not a degraded one.
      - key: DATABASE_URL
        fromDatabase:
          name: squish-db
          property: connectionString
      # Where password reset links are sent. Optional: with no webhook they are
      # printed to the Render log instead, which is a working reset for whoever
      # can read it. See docs/accounts.md.
      - key: SQUISH_MAIL_WEBHOOK
        sync: false
      - key: SQUISH_MAIL_TOKEN
        sync: false
      - key: NODE_VERSION
        value: 22.12.0

databases:
  - name: squish-db
    plan: free
    databaseName: squish
    user: squish
