# One-click deploy config. In Render: New → Blueprint → pick this repo.
# It reads this file, then asks for the secrets below.
#
# THIS FILE ONLY DOES ANYTHING IF THE SERVICE WAS CREATED AS A BLUEPRINT.
# A web service made by hand (New → Web Service) never reads it, however much
# it changes — settings for one of those live in the Render dashboard, under
# the service's own Environment tab, and this file is then documentation of
# what they should say rather than the thing that says it. The dashboard shows
# "Blueprints" in the sidebar: an empty list there means by hand.
services:
  - type: web
    name: squish
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      # Your Anthropic key. Typed into Render's dashboard, never into the repo.
      - key: ANTHROPIC_API_KEY
        sync: false
      # The tiers. Optional — the defaults in server/plan.ts are the ones the
      # price was set against, and the arithmetic behind them is in
      # docs/monetisation.md. Set these only to change policy.
      - key: SQUISH_FREE_PHOTOS
        sync: false
      - key: SQUISH_PLUS_PHOTOS
        sync: false
      - key: SQUISH_PLUS_CHATS
        sync: false
      # Turns on the device token, the diary backup and accounts. Filled in by
      # Render from the database below, so there is nothing to type.
      #
      # Remove this and the database, and Squish still works — the diary lives
      # in the browser and nothing is kept on the server. That is the mode it
      # was written in and it is not a degraded one.
      - key: DATABASE_URL
        fromDatabase:
          name: squish-db
          property: connectionString
      # The address Squish tells people to come back to, used for the links in
      # password reset emails.
      #
      # Without this the origin is read off the incoming request, which is
      # right on a laptop and right on a plain Render URL. It is wrong the
      # moment a proxy or a redirect makes the request arrive looking like it
      # came somewhere else — and a reset link pointing at the wrong host is a
      # reset that does not work.
      - key: SQUISH_PUBLIC_ORIGIN
        value: https://squish.online
      # Where password reset links are sent. Optional: with no webhook they are
      # printed to the Render log instead, which is a working reset for whoever
      # can read it. See docs/accounts.md.
      - key: SQUISH_MAIL_WEBHOOK
        sync: false
      - key: SQUISH_MAIL_TOKEN
        sync: false
      - key: NODE_VERSION
        value: 22.12.0

databases:
  - name: squish-db
    plan: free
    databaseName: squish
    user: squish
