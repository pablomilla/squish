# One-click deploy config. In Render: New → Blueprint → pick this repo.
# It reads this file, then asks for the secrets below.
#
# THIS FILE ONLY DOES ANYTHING IF THE SERVICE WAS CREATED AS A BLUEPRINT.
# A web service made by hand (New → Web Service) never reads it, however much
# it changes — settings for one of those live in the Render dashboard, under
# the service's own Environment tab, and this file is then documentation of
# what they should say rather than the thing that says it. The dashboard shows
# "Blueprints" in the sidebar: an empty list there means by hand.
services:
  - type: web
    name: squish
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      # Your Anthropic key. Typed into Render's dashboard, never into the repo.
      - key: ANTHROPIC_API_KEY
        sync: false
      # Checking passwords against known breaches. Optional and on by default;
      # set it to "off" to skip the check entirely, or point it at something
      # else that speaks the same range protocol. It already fails open, so
      # there is no need to turn it off because of an outage.
      - key: SQUISH_PWNED_API
        sync: false
      # Who sees the dashboard: comma-separated email addresses of accounts
      # that already exist. There is no admin password — an admin signs in
      # like anybody else and this list decides what they also see, so taking
      # somebody off it is the whole of revoking them.
      - key: SQUISH_ADMIN_EMAILS
        sync: false
      # The tiers. Optional — the defaults in server/plan.ts are the ones the
      # price was set against, and the arithmetic behind them is in
      # docs/monetisation.md. Set these only to change policy.
      - key: SQUISH_FREE_TASTE
        sync: false
      - key: SQUISH_PLUS_PHOTOS
        sync: false
      - key: SQUISH_PLUS_CHATS
        sync: false
      # Weekly plans from the nutritionist a month (default 4), and optionally a
      # cheaper model for them alone. See docs/monetisation.md.
      - key: SQUISH_PLUS_WEEKPLANS
        sync: false
      - key: SQUISH_WEEKPLAN_MODEL
        sync: false
      # "off" stops the server translating new interface strings into every
      # language after a deploy; they are then translated when first asked for.
      - key: SQUISH_I18N_WARM
        sync: false
      # Turns on the device token, the diary backup and accounts. Filled in by
      # Render from the database below, so there is nothing to type.
      #
      # Remove this and the database, and Squish still works — the diary lives
      # in the browser and nothing is kept on the server. That is the mode it
      # was written in and it is not a degraded one.
      - key: DATABASE_URL
        fromDatabase:
          name: squish-db
          property: connectionString
      # The address Squish tells people to come back to, used for the links in
      # password reset emails.
      #
      # Without this the origin is read off the incoming request, which is
      # right on a laptop and right on a plain Render URL. It is wrong the
      # moment a proxy or a redirect makes the request arrive looking like it
      # came somewhere else — and a reset link pointing at the wrong host is a
      # reset that does not work.
      - key: SQUISH_PUBLIC_ORIGIN
        value: https://app.squish.online
      # Where the website lives. With this set, requests for this address get
      # the website in site/ and every other address gets the app; unset,
      # every address gets the app. See server/site.ts and the README.
      - key: SQUISH_SITE_ORIGIN
        value: https://squish.online
      # Email: confirmation links, password resets and security notices.
      # Optional — with no webhook nothing is emailed, reset links go to the
      # Render log, and the app does not ask anybody to confirm an address.
      #
      # The payload is { from, to, subject, text }, which Resend takes as it
      # stands: set the webhook to https://api.resend.com/emails, the token to
      # the Resend API key, and the from-address to one on a domain you have
      # verified with them. Then use "Send me a test email" in the dashboard.
      - key: SQUISH_MAIL_WEBHOOK
        sync: false
      - key: SQUISH_MAIL_TOKEN
        sync: false
      - key: SQUISH_MAIL_FROM
        sync: false
      - key: NODE_VERSION
        value: 22.12.0

databases:
  - name: squish-db
    plan: free
    databaseName: squish
    user: squish
