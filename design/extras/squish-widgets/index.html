<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Squish widgets</title><style>body{font-family:system-ui,sans-serif;background:#eee8f1;color:#2b2340;margin:32px auto;max-width:1100px;padding:0 20px}h1{margin-bottom:8px}p{max-width:760px;line-height:1.5}select{font:inherit;padding:10px;border-radius:12px;border:1px solid #c5b4d7;background:white}section{margin-top:30px}h2{font-size:15px;font-weight:600}.row{display:flex;gap:20px;align-items:center;flex-wrap:wrap}img{max-width:100%;height:auto}.small{width:237px}.medium{width:507px}a{color:#594396}</style><h1>Squish widgets</h1><p>Design previews: small and medium, six visual states. Figures are examples. These are artwork previews, not live native widgets.</p><label>Appearance <select id="mode"><option value="light">Light</option><option value="dark">Dark</option><option value="ios-tinted">iOS tinted example</option><option value="android-neutral">Android neutral</option></select></label><div id="gallery"></div><p><a href="README.md">Handoff notes</a> · <a href="measurements.json">Measurements</a></p><script>const states=['nothing-morning','nothing-evening','on-track','reached','over','signed-out'];const gallery=document.querySelector('#gallery');function render(){let mode=document.querySelector('#mode').value;gallery.replaceChildren();for(let state of states){let section=document.createElement('section'),heading=document.createElement('h2'),row=document.createElement('div');heading.textContent=state.replaceAll('-',' ');row.className='row';for(let size of ['small','medium']){let img=document.createElement('img');img.className=size;img.src=`layouts/${size}/${mode}/${state}.svg`;img.alt=`${size}, ${mode}, ${state}`;row.append(img)}section.append(heading,row);gallery.append(section)}}document.querySelector('#mode').addEventListener('change',render);render();</script></html>
