<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Squad unlocked</title><style>body{margin:50px auto;max-width:650px;text-align:center;background:#FDF6EC;color:#2B2340;font:18px system-ui}img{width:240px;height:240px}button{padding:14px 24px;border:0;border-radius:18px;background:#6B5FE0;color:white;font:inherit}p{line-height:1.5}</style><h1>Squad unlocked</h1><img id="badge" src="share/stickers/squad-badge.svg" alt="Squad earned badge"><p>A one-second celebration. No loop.</p><button id="replay">Play celebration</button><p id="note"></p><script>const reduce=matchMedia('(prefers-reduced-motion: reduce)');document.querySelector('#replay').onclick=()=>{let img=document.querySelector('#badge');if(reduce.matches){img.src='share/stickers/squad-badge.svg';document.querySelector('#note').textContent='Reduced motion: showing the still badge.';return}img.src='share/stickers/squad-badge-unlock.svg?play='+Date.now();document.querySelector('#note').textContent='';};</script></html>
